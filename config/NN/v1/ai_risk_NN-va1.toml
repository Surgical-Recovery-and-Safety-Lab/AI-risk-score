[[architecture.layers]]
type = "BatchNorm1d"

[[architecture.layers]]
type = "ReLU"

[[architecture.layers]]
type = "Linear"
out_features = 25

[[architecture.layers]]
type = "BatchNorm1d"

[[architecture.layers]]
type = "ReLU"

[[architecture.layers]]
type = "Linear"
out_features = 25

[[architecture.layers]]
type = "BatchNorm1d"

[[architecture.layers]]
type = "ReLU"

[[architecture.layers]]
type = "Linear"
out_features = 10

[[architecture.layers]]
type = "BatchNorm1d"

[[architecture.layers]]
type = "ReLU"

[[architecture.layers]]
