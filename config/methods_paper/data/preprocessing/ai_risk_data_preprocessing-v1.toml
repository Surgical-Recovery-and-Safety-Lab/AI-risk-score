[preprocessing]
preprocess = true  # Perform preprocessing if true

[preprocessing.bin]
# List of features to power transform
feature_list = [
  "M3_SCORE",
]

[preprocessing.ordinal_encoder]
# List of features to label encode
feature_list = [
  "SEX",
  "ETHNICITY",
  "GCH2018",
  "ADMISSION_ACUITY",
  "ADMISSION_SOURCE",
  "CATEGORY_LEVEL_1",
]

[preprocessing.standardise]
# List of features to standardise
feature_list = [
  "AGE",
  "ETHNICITY",
  "DEP18",
  "GCH2018",
  "CATEGORY_LEVEL_1",
]
